name: Keep Supabase awake

# THIS IS AN ALARM, NOT A PREVENTATIVE. Read this before trusting it.
#
# It was written believing that querying the database often enough would keep
# the free-tier pause timer from filling up. That belief is wrong, and there is
# direct evidence: this workflow returned a clean HTTP 200 on 2026-08-25 and the
# project was paused by 2026-08-28 — three days later, against a seven-day
# window. The pings were landing. They simply did not count as "activity".
#
# In hindsight that is the obvious outcome. Supabase has every incentive not to
# let a trivial automated read reset the timer, or the pause policy would do
# nothing at all. Do not "fix" this by pinging more often; the cadence was never
# the problem. Switching it to a write might register where a read doesn't, but
# that is a guess at a rule they have good reason to keep opaque and to tighten,
# and the failure mode is discovering it didn't work at the start of a trip.
#
# What this workflow IS good for: it fails loudly and emails the repo owner
# within three days of the database going to sleep. That early warning is the
# whole remaining value, and it worked. Keep it for that.
#
# The actual fix is to restore the project from the dashboard before a trip, the
# way you would charge a battery. Only the paid tier stops the pausing.
#
# ⚠ A paused project cannot be restored after 90 days. The data stays
# downloadable, but the project is gone. If that ever happens: create a fresh
# project, paste supabase/schema.sql into the SQL editor, and update SB_URL and
# SB_KEY in index.html. That is exactly why the schema lives in the repo as a
# file rather than only inside the database.
#
# THIS IS UNRELATED TO GITHUB PAGES. Pages stays on "Deploy from a branch";
# CLAUDE.md's warning against the Actions *source* is about that setting, not
# about this workflow. Deleting this will not fix a Pages problem — it will
# quietly let the database fall asleep.

on:
  schedule:
    # Every 3rd day at 09:17 UTC. Deliberately not weekly: GitHub delays or
    # drops scheduled runs under load, and the pause window is only 7 days.
    # An odd minute avoids the on-the-hour congestion GitHub warns about.
    - cron: '17 9 */3 * *'
  workflow_dispatch:   # so you can run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          # The publishable key is already public in index.html on the live
          # site — that is what it is for. Nothing secret is exposed here, and
          # keeping it inline means there is no repo secret to silently expire.
          URL="https://bejgcgrbdrnuvwvcqrvz.supabase.co/rest/v1/games?select=id&limit=1"
          KEY="sb_publishable_t64k5eE5QNvOKH-348LLvA_b7ogAGTA"

          code=$(curl -sS -o body.txt -w '%{http_code}' \
                 --max-time 30 --retry 3 --retry-delay 10 \
                 -H "apikey: $KEY" "$URL")

          echo "HTTP $code"
          echo "response: $(cat body.txt)"

          # Fail loudly. A silent failure here is the whole thing this guards
          # against, and a failed run emails the repo owner.
          if [ "$code" != "200" ]; then
            echo "::error::Supabase ping failed (HTTP $code). The project may be paused — restore it at supabase.com/dashboard."
            exit 1
          fi
          echo "Database is awake."
