<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Hunt</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#141A23">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate Hunt">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Overpass:wght@400;600;700&family=Overpass+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#141A23; --dusk:#1C242F; --edge:#2C3644;
  --blank:#8A939E; --blank-hi:#B4BCC5; --sheeting:#F4F6F1;
  --guide:#17604A; --guide-lit:#2C9A76; --ink:#0E1319; --mute:#7E8895;
  --r-common:#5F6E7E; --r-uncommon:#3E8E7E; --r-rare:#E8A33D; --r-legend:#E2574C;
  --d-common:#2E3742; --d-uncommon:#234840; --d-rare:#453722; --d-legend:#452926;
  --plate:"Archivo",system-ui,sans-serif;
  --sign:"Overpass",system-ui,sans-serif;
  --data:"Overpass Mono",ui-monospace,monospace;
  --pad:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--asphalt);color:var(--sheeting);font-family:var(--sign)}
body{padding:0 var(--pad) calc(28px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto;min-height:100vh;
  background-image:radial-gradient(120% 80% at 50% -10%, #1E2836 0%, var(--asphalt) 60%)}

/* Sticky collapsing deck: header + score + map stay pinned and shrink on scroll */
.deck{position:sticky;top:0;z-index:10;
  margin:0 calc(-1 * var(--pad));padding:calc(14px + env(safe-area-inset-top)) var(--pad) 6px;
  background:var(--asphalt);transition:box-shadow .25s ease,background .25s ease}
body.scrolled .deck{box-shadow:0 10px 24px -8px rgba(0,0,0,.7);background:rgba(20,26,35,.96);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* Slim wordmark — quiet label, not a billboard */
.sign{display:flex;align-items:center;gap:9px;overflow:hidden;padding:2px 2px 0;
  transition:max-height .3s ease,opacity .25s ease,margin .3s ease,transform .3s ease;
  max-height:34px}
body.scrolled .sign{max-height:0;opacity:0;margin-top:-2px;transform:translateY(-5px)}
.sign i{flex:none;width:4px;height:15px;border-radius:2px;background:var(--guide-lit);
  box-shadow:0 0 8px -1px var(--guide-lit)}
.sign h1{margin:0;font-family:var(--sign);font-weight:700;font-size:13px;line-height:1;
  text-transform:uppercase;letter-spacing:.26em;color:var(--blank-hi)}
.sign .sub{margin:0 0 0 auto;font-family:var(--data);font-size:10px;font-weight:400;
  letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1}

/* The score is the hero now — it is what the map used to be. Points lead at
   display size, the spotted count plays second, and both shrink on scroll. */
.tally{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:11px 2px 10px;transition:margin .3s ease}
body.scrolled .tally{margin:0 2px 8px}
.stat{display:flex;align-items:baseline;gap:7px}
/* Deliberately NOT transitioned. Animating font-size reflows the sticky deck
   on every frame for 300ms, which iOS renders as judder. It snaps; the .sign
   and .prog max-height transitions carry the motion. */
.stat b{font-family:var(--data);font-weight:700;font-size:22px;letter-spacing:-.02em;display:inline-block}
.stat span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
/* Reserve the digits. Without this, 9→10 widens the figure and shoves the
   spotted count sideways on the tap that scores it — small, but it lands as
   the whole header twitching. Monospace, so ch units are exact. */
.stat.pts b{color:var(--guide-lit);font-size:46px;line-height:.9;min-width:3ch}
.stat:not(.pts) b{min-width:2ch}
.stat.pts span{color:var(--blank-hi)}
body.scrolled .stat.pts b{font-size:27px}
body.scrolled .stat b{font-size:19px}
/* The pulse is anchored left, not centred: a centred scale makes the digits
   swell in both directions and reads as the screen wobbling. The hero figure
   also gets a much gentler scale — 1.2 was tuned when this was 26px type, and
   at 46px the same multiplier throws the number around. */
.stat b{transform-origin:left center}
.stat b.bump{animation:bump .35s cubic-bezier(.25,1.5,.4,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.stat.pts b.bump{animation:bumphero .4s cubic-bezier(.25,1.3,.4,1)}
@keyframes bumphero{0%{transform:scale(1)}42%{transform:scale(1.07)}100%{transform:scale(1)}}
.share{margin-left:auto;background:none;border:1.4px solid var(--guide-lit);color:var(--guide-lit);
  font-family:var(--sign);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  padding:9px 15px;border-radius:6px;cursor:pointer;transition:.16s ease}
.share:hover{background:var(--guide);border-color:var(--guide);color:var(--sheeting)}
.share:focus-visible{outline:2px solid var(--sheeting);outline-offset:2px}
.tallyspace{height:12px;transition:height .3s ease}
body.scrolled .tallyspace{height:4px}

/* Progress — states only. The optional groups hold ~310 pts on plates that
   cannot realistically be seen, so counting them would cap this bar at 62%
   forever. Progress means states; score means everything. */
.prog{margin:0 2px 10px;transition:max-height .3s ease,opacity .25s ease,margin .3s ease;max-height:40px}
.progbar{height:6px;border-radius:99px;background:var(--edge);overflow:hidden}
.progbar i{display:block;height:100%;border-radius:99px;background:var(--guide-lit);
  transition:width .45s cubic-bezier(.3,1,.4,1)}
.proglab{display:flex;justify-content:space-between;margin:5px 1px 0;
  font-family:var(--data);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
body.scrolled .prog{max-height:0;opacity:0;margin:0;overflow:hidden}

/* Standings that follow you down the page. The exact mirror of .prog — as the
   score and bar fold away on scroll, this folds in, so the deck's height barely
   moves and the collapse guard has nothing new to fight. Only rendered when
   there is a game with a board; solo play never sees it. */
.mini{max-height:0;opacity:0;overflow:hidden;margin:0 2px;
  transition:max-height .3s ease,opacity .25s ease,margin .3s ease}
body.scrolled .mini.on{max-height:34px;opacity:1;margin:0 2px 8px}
.miniin{display:flex;align-items:center;gap:9px;min-height:30px;padding:0 11px;border-radius:8px;
  background:var(--dusk);border:1px solid var(--edge);
  font-family:var(--data);font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden}
.miniin s{text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.miniin b{color:var(--sheeting);font-weight:700}
.miniin u{text-decoration:none;color:var(--r-rare);font-weight:700}
.miniin .mme u{color:var(--guide-lit)}
.miniin .mme b{color:var(--guide-lit)}
.minidiv{flex:none;color:var(--edge)}

/* The callout — fixed layer, always on screen no matter the scroll position */
.celebrate{position:fixed;left:0;right:0;z-index:30;pointer-events:none;display:flex;justify-content:center}
.shout{position:absolute;left:50%;top:0;z-index:6;pointer-events:none;text-align:center;
  width:96%;max-width:640px;transform:translate(-50%,-50%)}
.shout .fl{position:absolute;left:50%;top:50%;width:min(94%,420px);aspect-ratio:1;
  transform:translate(-50%,-50%) scale(.2);
  background:radial-gradient(circle,var(--fc) 0%,transparent 62%);
  animation:flare .85s ease-out forwards}
@keyframes flare{0%{transform:translate(-50%,-50%) scale(.2);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(2.3);opacity:0}}
.shout .nm{position:relative;font-family:var(--plate);font-weight:900;text-transform:uppercase;
  letter-spacing:-.01em;line-height:1;color:#fff;white-space:nowrap;
  text-shadow:0 0 18px var(--fc),0 4px 22px rgba(0,0,0,.9);animation:shout var(--dur) ease forwards}
/* The rarity is the whole point of the tier ladder; at 14px under a 46px name
   it whispered. Letter-spacing tightens as it grows so "+40 · LEGENDARY" still
   holds one line on a narrow phone. */
.shout .pt{position:relative;margin-top:9px;font-family:var(--data);font-weight:700;font-size:20px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--fc);white-space:nowrap;
  text-shadow:0 0 14px var(--fc),0 2px 10px rgba(0,0,0,.9);animation:shout var(--dur) ease forwards}
@keyframes shout{
  0%{opacity:0;transform:scale(.5)}
  16%{opacity:1;transform:scale(1.07)}
  26%{transform:scale(1)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.09)}
}
/* Legendary: the whole screen goes dark and the name burns. Replaces the old
   map dim — bigger stage, same idea. ~7 times a game; that scarcity is the point. */
.blackout{position:fixed;inset:0;z-index:29;pointer-events:none;background:#05070A;
  opacity:0;animation:blackout 1.5s ease forwards}
@keyframes blackout{0%{opacity:0}18%{opacity:.94}68%{opacity:.94}100%{opacity:0}}
.shout.legend .nm{color:#fff;
  text-shadow:0 0 26px #fff,0 0 60px var(--fc),0 4px 22px rgba(0,0,0,.9)}

/* Achievement unlocked — deliberately unlike the plate callout, so the two
   never read as the same event. */
.unlock{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:33;
  transform:translateX(-50%);width:min(94%,420px);pointer-events:none;
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;
  background:linear-gradient(100deg,#1B2E27,#243B33);border:1.4px solid var(--guide-lit);
  box-shadow:0 10px 34px rgba(0,0,0,.55);animation:unlockIn .5s cubic-bezier(.2,1.4,.4,1)}
.unlock.out{animation:unlockOut .3s ease-in forwards}
.unlock .ubadge{flex:none;font-size:26px;line-height:1;filter:drop-shadow(0 0 9px var(--guide-lit))}
.unlock .utext{flex:1;min-width:0}
.unlock .utext b{display:block;font-family:var(--data);font-size:9.5px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--guide-lit)}
.unlock .utext span{display:block;font-family:var(--plate);font-size:15px;font-weight:800;
  letter-spacing:.02em;color:var(--sheeting);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unlock .upt{flex:none;font-family:var(--data);font-size:15px;font-weight:700;color:var(--r-rare)}
@keyframes unlockIn{from{opacity:0;transform:translateX(-50%) translateY(-16px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes unlockOut{to{opacity:0;transform:translateX(-50%) translateY(-12px)}}

/* Lists */
.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 8px}
.sectionhead h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.sectionhead span{font-family:var(--data);font-size:11px;color:var(--mute)}

/* Sort toggle */
.sortbar{display:flex;align-items:center;gap:6px;padding:0 0 10px}
.sortbar em{font-style:normal;font-family:var(--data);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute);margin-right:2px}
.sortbtn{background:var(--dusk);border:1.4px solid var(--edge);color:var(--mute);border-radius:6px;
  padding:7px 12px;font-family:var(--sign);font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;transition:.16s ease}
.sortbtn[aria-pressed="true"]{background:var(--guide);border-color:var(--guide);color:var(--sheeting)}
.sortbtn:focus-visible{outline:2px solid var(--sheeting);outline-offset:2px}

/* Undo on the celebration */
.undo{position:fixed;left:50%;transform:translateX(-50%);z-index:31;
  background:var(--sheeting);color:var(--ink);border:0;border-radius:8px;
  font-family:var(--sign);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:10px 20px;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.7);
  animation:undoIn .25s ease-out}
@keyframes undoIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
.undo.out{animation:undoOut .25s ease-in forwards}
@keyframes undoOut{to{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* Achievements — treated as their own thing. Locked reads as a dimmed
   silhouette, earned lights up. Emoji as badges: no assets to fetch, which
   the no-toolchain rule requires. */
.ach{display:flex;align-items:center;gap:13px;width:100%;min-height:58px;background:var(--dusk);
  border:1.4px solid var(--edge);border-left:5px solid var(--edge);border-radius:10px;padding:11px 14px;
  color:var(--blank-hi);font-family:var(--sign);font-size:14.5px;font-weight:600;text-align:left}
.ach .abadge{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-size:20px;line-height:1;background:var(--asphalt);border:1px solid var(--edge);
  filter:grayscale(1);opacity:.4;transition:filter .35s ease,opacity .35s ease}
.ach .atext{flex:1;min-width:0}
.ach .atext em{display:block;font-style:normal;font-family:var(--data);font-size:10.5px;font-weight:400;
  color:var(--mute);letter-spacing:.04em;margin-top:3px}
.ach .abar{display:block;height:4px;border-radius:99px;background:var(--edge);overflow:hidden;margin-top:7px}
.ach .abar i{display:block;height:100%;border-radius:99px;background:var(--mute);
  transition:width .4s cubic-bezier(.3,1,.4,1)}
.ach .apt{flex:none;font-family:var(--data);font-size:13px;font-weight:700;color:var(--r-rare);
  min-width:32px;text-align:right}
.ach.got{background:var(--sheeting);color:var(--ink);border-left-color:var(--guide)}
.ach.got .abadge{filter:none;opacity:1;background:#E7EBE4;border-color:#CBD3C8;
  box-shadow:0 0 14px rgba(44,154,118,.5)}
.ach.got .atext em{color:#6A7280}
.ach.got .apt{color:var(--guide)}
.ach.close{border-left-color:var(--r-rare)}
.ach.close .abar i{background:var(--r-rare)}
/* Achievements live in their own block after the plate groups, not wedged
   between them — scrolling the hunt list shouldn't run you through an
   unrelated section. Still collapsible, still closed by default: this is a
   destination, not the main event. */
.achv{margin-top:22px;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);
  background:linear-gradient(160deg,rgba(44,154,118,.08),transparent 62%)}
.achv .grouphead{align-items:flex-start;padding:16px 2px 15px}
.achv .gtext h2{font-family:var(--plate);font-size:15px;font-weight:800;letter-spacing:.06em;
  color:var(--sheeting)}
.achv .gtext p{margin-top:5px;font-size:11.5px}
.achv .chev{margin-top:2px}
/* the teaser: every badge, locked ones dimmed exactly like the rows below */
.achstrip{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.achstrip i{font-style:normal;font-size:16px;line-height:1;filter:grayscale(1);opacity:.35}
.achstrip i.got{filter:none;opacity:1;text-shadow:0 0 9px rgba(44,154,118,.7)}
.achhead{display:flex;align-items:baseline;gap:9px;padding:2px 2px 10px}
.achhead b{font-family:var(--data);font-size:22px;font-weight:700;color:var(--sheeting);letter-spacing:-.02em}
.achhead span{font-family:var(--data);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--mute)}
.achhead em{margin-left:auto;font-style:normal;font-family:var(--data);font-size:12px;
  font-weight:700;color:var(--r-rare)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;max-height:120px;overflow:hidden;
  background:var(--dusk);border:1.4px solid var(--edge);border-left:5px solid var(--rc);border-radius:8px;
  padding:10px 14px;cursor:pointer;color:var(--blank-hi);font-family:var(--sign);font-size:15px;font-weight:600;
  text-align:left;transition:background .16s ease,color .16s ease}
.row:focus-visible{outline:2px solid var(--sheeting);outline-offset:2px}
.row .ab{font-family:var(--plate);font-weight:900;font-size:12px;letter-spacing:.04em;color:var(--mute);flex:none;width:34px}
.row .nm{flex:1;min-width:0}
.row .nm em{display:block;font-style:normal;font-family:var(--data);font-size:10.5px;font-weight:400;
  color:var(--mute);letter-spacing:.04em;margin-top:2px}
.row .pt{font-family:var(--data);font-size:12px;font-weight:700;color:var(--rc);flex:none}
.row .tick{flex:none;width:20px;height:20px;border-radius:4px;border:1.6px solid var(--edge);
  display:grid;place-items:center;font-size:12px;color:transparent}
.row.on{background:var(--sheeting);color:var(--ink)}
.row.on .ab{color:#6A7280}
.row.on .nm em{color:#6A7280}
.row.on .tick{background:var(--guide);border-color:var(--guide);color:#fff}
.row.leaving{animation:leave .32s ease-in forwards}
@keyframes leave{to{max-height:0;min-height:0;opacity:0;padding-top:0;padding-bottom:0;
  border-top-width:0;border-bottom-width:0;margin-bottom:-6px;transform:translateX(26px)}}
.row[disabled]{opacity:.35;cursor:not-allowed}
.empty{font-size:13px;color:var(--mute);padding:14px 2px;font-style:italic}
.done{background:var(--guide);border-radius:9px;padding:14px;text-align:center;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;font-size:13px}

/* Sections */
.groups{margin-top:26px;border-top:1px solid var(--edge)}
.grp{border-bottom:1px solid var(--edge)}
.grouphead{display:flex;align-items:center;gap:12px;padding:14px 2px;cursor:pointer}
/* The chevron is the only signal a section opens at all, so it gets contrast
   and a real tap target. It was 11px in --mute and effectively invisible. */
.chev{flex:none;width:26px;height:26px;display:grid;place-items:center;
  color:var(--sheeting);font-size:19px;line-height:1;
  transition:transform .2s ease,opacity .15s ease}
.grouphead[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grouphead:active .chev{opacity:.5;transform:scale(.86)}
.grouphead[aria-expanded="true"]:active .chev{transform:rotate(90deg) scale(.86)}
.gtext{flex:1;min-width:0}
.gtext h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sheeting)}
.gtext p{margin:3px 0 0;font-family:var(--data);font-size:11px;color:var(--mute)}
/* No per-group switches: every group is always in play. That is what makes
   scores comparable between players without a per-game ruleset. */
.body{display:none;flex-direction:column;gap:6px;padding:0 0 16px}
.body.show{display:flex}

.foot{display:flex;justify-content:center;margin-top:26px}
.reset{background:none;border:1.4px solid var(--edge);color:var(--mute);font-family:var(--sign);font-size:11px;
  font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding:10px 18px;border-radius:6px;cursor:pointer;transition:.16s ease}
.reset:hover{border-color:var(--r-legend);color:var(--r-legend)}

/* Toast + iOS install nudge */
.snack{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--sheeting);color:var(--ink);font-size:13px;font-weight:600;padding:11px 18px;border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.6);z-index:20;animation:snack 2.2s ease forwards}
@keyframes snack{0%{opacity:0;transform:translateX(-50%) translateY(12px)}
  12%,80%{opacity:1;transform:translateX(-50%) translateY(0)}
  100%{opacity:0;transform:translateX(-50%) translateY(-8px)}}
.nudge{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:19;
  background:var(--dusk);border:1.4px solid var(--guide-lit);border-radius:10px;padding:13px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 10px 34px rgba(0,0,0,.7);max-width:520px;margin:0 auto}
.nudge p{margin:0;flex:1;font-size:12.5px;line-height:1.45;color:var(--blank-hi)}
.nudge b{color:var(--sheeting)}
.nudge button{flex:none;background:none;border:1.4px solid var(--edge);color:var(--mute);border-radius:6px;
  padding:7px 11px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:var(--sign)}

/* Scoped to the deck, and it must stay that way. measureDeck() toggles this to
   read settled heights instead of mid-transition ones. As `body.nomotion *` it
   hit every element on the page, and killing an animation then un-killing it
   RESTARTS it from frame zero — so the row sliding out, the callout, the undo
   button and the unlock banner all snapped and replayed at once. That is what
   "the whole page shakes" was. Every `body.scrolled` rule targets something
   inside .deck, so the deck is all this ever needed to cover. */
.deck.nomotion, .deck.nomotion *{transition:none !important;animation:none !important}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ── group play ── */
.game{margin:0 var(--pad) 2px;font-family:var(--sign)}
.gamecard{background:var(--dusk);border:1px solid var(--edge);border-radius:11px;padding:14px}
.gamecard h2{margin:0 0 3px;font-family:var(--plate);font-size:13px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--sheeting)}
.gamecard>p{margin:0;font-size:12px;color:var(--mute);line-height:1.45}
.gamebtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.gbtn{flex:1 1 auto;min-height:42px;padding:0 14px;border-radius:8px;cursor:pointer;
  font-family:var(--sign);font-size:12.5px;font-weight:700;
  background:var(--guide);border:1.4px solid var(--guide-lit);color:var(--sheeting)}
.gbtn.alt{background:none;border-color:var(--edge);color:var(--blank-hi)}
.gbtn:disabled{opacity:.55;cursor:default}
.gbtn:focus-visible{outline:2px solid var(--sheeting);outline-offset:2px}
.gform{display:flex;flex-direction:column;gap:5px;margin-top:12px}
.gform label{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em;margin-top:5px}
/* iOS ignores an author width on date inputs unless appearance is cleared —
   that is what made these overflow the card. min-width:0 stops the intrinsic
   width of the date spinner from pushing the flex column wider. */
.gform input{width:100%;min-width:0;max-width:100%;min-height:44px;padding:0 10px;border-radius:8px;
  background:var(--asphalt);border:1.4px solid var(--edge);color:var(--sheeting);
  font-family:var(--sign);font-size:15px;text-align:left;
  appearance:none;-webkit-appearance:none}
.gform input[type=date]{display:block;line-height:1.2}
.gform input:focus{outline:none;border-color:var(--guide-lit)}

/* Scoreboard: this is the shared thing everyone stares at, so the numbers get
   real size and the leader is visibly the leader. */
.sbrow{display:flex;align-items:center;gap:11px;min-height:54px;padding:0 13px;border-radius:9px;
  background:var(--asphalt);border-left:3px solid var(--edge);margin-top:7px}
.sbrow.me{border-left-color:var(--guide-lit)}
.sbrow.lead{border-left-color:var(--r-rare);
  background:linear-gradient(90deg,rgba(232,163,61,.13),var(--asphalt) 62%)}
.sbrow .rank{font-family:var(--data);font-size:12.5px;font-weight:700;color:var(--mute);
  min-width:19px;text-align:center}
.sbrow.lead .rank{font-size:15px}
.sbrow .who{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--sheeting);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbrow .who u{text-decoration:none;font-family:var(--data);font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--guide-lit);margin-left:7px}
.sbrow .who em{display:block;font-style:normal;font-family:var(--data);font-size:10.5px;
  font-weight:400;color:var(--mute)}
.sbrow .sc{flex:none;font-family:var(--data);font-size:22px;font-weight:700;color:var(--r-rare);
  letter-spacing:-.02em}
.sbrow.me .sc{color:var(--guide-lit)}
.gact{margin-top:11px;font-family:var(--data);font-size:11px;color:var(--mute);line-height:1.65}
.gact b{color:var(--blank-hi);font-weight:400}
.gmeta{display:flex;align-items:center;gap:6px;margin-top:11px;font-family:var(--data);
  font-size:10.5px;color:var(--mute);flex-wrap:wrap}
.gdot{width:7px;height:7px;border-radius:50%;background:var(--r-legend);flex:none}
.gdot.on{background:var(--guide-lit)}
.gpend{color:var(--r-rare)}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="deck" id="deck">
  <header class="sign">
    <i></i>
    <h1>Plate Hunt</h1>
    <p class="sub">Spot every state</p>
  </header>

  <div class="tally">
    <div class="stat pts"><b id="pts">0</b><span>points</span></div>
    <div class="stat"><b id="found">0</b><span>/ <i id="total">73</i> spotted</span></div>
    <button class="share" id="share">Share</button>
  </div>
  <div class="tallyspace"></div>

  <div class="prog" id="prog">
    <div class="progbar"><i id="progfill" style="width:0%"></i></div>
    <div class="proglab"><span id="proglabl">0 of 51 states</span><span id="proglabr">0%</span></div>
  </div>

  <div class="mini" id="mini"></div>
</div>

<div class="celebrate" id="celebrate" aria-hidden="true"></div>

<section class="game" id="game"></section>

<section class="groups" id="groups"></section>
<section class="achv" id="achv"></section>
<div class="foot"><button class="reset" id="reset">Start over</button></div>

<script>

const mem={};
const store={
  get(k){ try{return localStorage.getItem(k)}catch(e){return k in mem?mem[k]:null} },
  set(k,v){ try{localStorage.setItem(k,v)}catch(e){mem[k]=v} }
};
/* corrupt or half-written saves must not blank the app — fall back to defaults */
const readJSON=(k,fb)=>{
  const raw=store.get(k);
  if(!raw) return fb;
  try{ return JSON.parse(raw); }catch(e){ return fb; }
};

const TIER={
  common:{pts:1,color:'var(--r-common)',dark:'var(--d-common)',label:'Common',emoji:'⬜'},
  uncommon:{pts:2,color:'var(--r-uncommon)',dark:'var(--d-uncommon)',label:'Uncommon',emoji:'🟩'},
  rare:{pts:5,color:'var(--r-rare)',dark:'var(--d-rare)',label:'Rare',emoji:'🟨'},
  legend:{pts:10,color:'var(--r-legend)',dark:'var(--d-legend)',label:'Legendary',emoji:'🟥'}
};
const ORDER=['common','uncommon','rare','legend'];

const STATES={
  AL:['Alabama','rare'], AK:['Alaska','legend'], AZ:['Arizona','rare'], AR:['Arkansas','rare'],
  CA:['California','uncommon'], CO:['Colorado','rare'], CT:['Connecticut','uncommon'], DE:['Delaware','common'],
  DC:['Washington, D.C.','common'], FL:['Florida','uncommon'], GA:['Georgia','uncommon'], HI:['Hawaii','legend'],
  ID:['Idaho','legend'], IL:['Illinois','uncommon'], IN:['Indiana','uncommon'], IA:['Iowa','rare'],
  KS:['Kansas','rare'], KY:['Kentucky','uncommon'], LA:['Louisiana','rare'], ME:['Maine','rare'],
  MD:['Maryland','common'], MA:['Massachusetts','uncommon'], MI:['Michigan','uncommon'], MN:['Minnesota','rare'],
  MS:['Mississippi','rare'], MO:['Missouri','rare'], MT:['Montana','legend'], NE:['Nebraska','rare'],
  NV:['Nevada','rare'], NH:['New Hampshire','rare'], NJ:['New Jersey','common'], NM:['New Mexico','rare'],
  NY:['New York','common'], NC:['North Carolina','common'], ND:['North Dakota','legend'], OH:['Ohio','common'],
  OK:['Oklahoma','rare'], OR:['Oregon','rare'], PA:['Pennsylvania','common'], RI:['Rhode Island','rare'],
  SC:['South Carolina','uncommon'], SD:['South Dakota','legend'], TN:['Tennessee','uncommon'], TX:['Texas','uncommon'],
  UT:['Utah','rare'], VT:['Vermont','rare'], VA:['Virginia','common'], WA:['Washington','rare'],
  WV:['West Virginia','common'], WI:['Wisconsin','rare'], WY:['Wyoming','legend']
};

const OPTIONAL={
  terr:{name:'Territories',items:[
    ['PR','Puerto Rico',15,'rare'],['GU','Guam',40,'legend'],['VI','U.S. Virgin Islands',40,'legend'],
    ['AS','American Samoa',40,'legend'],['MP','N. Mariana Islands',40,'legend']]},
  prov:{name:'Canadian Provinces',items:[
    ['ON','Ontario',10,'uncommon'],['QC','Quebec',12,'uncommon'],['BC','British Columbia',25,'rare'],
    ['AB','Alberta',25,'rare'],['MB','Manitoba',25,'rare'],['SK','Saskatchewan',30,'rare'],
    ['NS','Nova Scotia',25,'rare'],['NB','New Brunswick',25,'rare'],['NL','Newfoundland',30,'rare'],
    ['PE','Prince Edward Is.',30,'rare'],['NT','Northwest Terr.',50,'legend'],['YT','Yukon',50,'legend'],
    ['NU','Nunavut',50,'legend']]},
  spec:{name:'Special Plates',items:[
    ['GOV','U.S. Government',3,'common'],['DPL','Diplomatic',10,'rare'],
    ['TRB','Tribal Nation',15,'rare'],['ANT','Antique / Historic',5,'uncommon']]}
};

const INDEX={};
for(const [c,[n,t]] of Object.entries(STATES)) INDEX[c]={name:n,pts:TIER[t].pts,tier:t,group:'states'};
for(const [gid,g] of Object.entries(OPTIONAL))
  for(const [c,n,p,t] of g.items) INDEX[c]={name:n,pts:p,tier:t,group:gid};

/* ── achievements ──
   Each carries an emoji badge: console games give achievements their own art,
   and emoji are the only way to do that here without fetching an asset.
   `any:` counts STATES only — the progress bar is states-only, so a milestone
   that counted Guam would contradict the thing right above it. */
const ACH=[
  {id:'ne',    e:'🍂', n:'New England',     d:'ME · NH · VT · MA · RI · CT', set:['ME','NH','VT','MA','RI','CT'], p:10},
  {id:'4c',    e:'🏜️', n:'Four Corners',    d:'AZ · NM · UT · CO',           set:['AZ','NM','UT','CO'],           p:6},
  {id:'pac',   e:'🌊', n:'Pacific Coast',   d:'CA · OR · WA',                set:['CA','OR','WA'],                p:5},
  {id:'south', e:'🎷', n:'Deep South',      d:'AL · MS · LA · GA · SC',      set:['AL','MS','LA','GA','SC'],      p:6},
  {id:'empty', e:'🏔️', n:'The Big Empty',   d:'MT · WY · ND · SD · ID',      set:['MT','WY','ND','SD','ID'],      p:15},
  {id:'news',  e:'📰', n:'The Four News',   d:'York · Jersey · Mexico · Hampshire', set:['NY','NJ','NM','NH'],    p:5},
  {id:'twins', e:'👯', n:'Twins',           d:'Both Dakotas, Carolinas, Virginias', set:['ND','SD','NC','SC','VA','WV'], p:8},
  {id:'river', e:'🛶', n:'River Run',       d:'The ten Mississippi River states',
   set:['MN','WI','IA','IL','MO','KY','TN','AR','MS','LA'], p:10},
  {id:'c2c',   e:'🌉', n:'Coast to Coast',  d:'California · Maine',          set:['CA','ME'],                     p:4},
  {id:'start', e:'🚗', n:'Getting Started', d:'Any 10 states',               any:10,                              p:3},
  {id:'half',  e:'🛣️', n:'Halfway',         d:'Any 26 states',               any:26,                              p:5},
  {id:'untch', e:'💎', n:'The Untouchables',d:'All seven legendary states',  tier:'legend',                       p:15},
  {id:'perf',  e:'🏆', n:'Perfect Board',   d:'All 50 states and D.C.',      allStates:true,                      p:20}
];

/* claimed: code -> timestamp. Reads the old array format too. */
const rawC=readJSON('lpb.claimed',{})||{};
let claimed=new Map(Array.isArray(rawC)?rawC.map(c=>[c,null]):Object.entries(rawC));
const rawO=readJSON('lpb.open',null);
let opened=new Set(Array.isArray(rawO)?rawO:['states']);
let sortMode=store.get('lpb.sort')||'az';

/* group play — declared here so save() and toggle() can see them */
let game=readJSON('lpb.game',null);      // {id,name,starts_at,ends_at,ruleset}
let me=readJSON('lpb.entry',null);       // {id,secret,name,game_id}
let outbox=readJSON('lpb.outbox',[]);    // spots waiting for a signal
let board=readJSON('lpb.board',null);    // last scoreboard we managed to fetch
let synced=new Set(readJSON('lpb.synced',[])||[]);  // codes the server has confirmed
if(!Array.isArray(outbox)) outbox=[];
if(game&&!me) game=null;                 // half-written state: fall back to solo

const save=()=>{
  store.set('lpb.claimed',JSON.stringify(Object.fromEntries(claimed)));
  store.set('lpb.open',JSON.stringify([...opened]));
  store.set('lpb.sort',sortMode);
};
/* Every group is always in play, so every known code counts. This used to
   depend on per-player switches; making it constant is what lets any two
   scores be compared without a per-game ruleset. */
const ALL_GROUPS=Object.keys(OPTIONAL);
const BOARD_SIZE=Object.keys(INDEX).length;
const live=c=>!!INDEX[c];
const clock=ts=>ts?new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'';

/* rows */
const rowHTML=(code,withTime)=>{
  const i=INDEX[code], ts=claimed.get(code);
  return `<button class="row" data-code="${code}" style="--rc:${TIER[i.tier].color}">
    <span class="ab">${code}</span>
    <span class="nm">${i.name}${withTime&&ts?`<em>${clock(ts)}</em>`:''}</span>
    <span class="pt">${i.pts}</span><span class="tick">✓</span></button>`;
};
const byName=(a,b)=>INDEX[a].name.localeCompare(INDEX[b].name);
const sortStates=codes=>codes.slice().sort((a,b)=>
  sortMode==='pts' ? (INDEX[b].pts-INDEX[a].pts)||byName(a,b) : byName(a,b));

document.getElementById('groups').innerHTML =
  `<div class="grp">
      <div class="grouphead" role="button" tabindex="0" data-g="states" aria-expanded="true">
        <span class="chev">▶</span>
        <span class="gtext"><h2>States &amp; D.C.</h2><p data-count="states"></p></span>
      </div>
      <div class="body" data-body="states">
        <div class="sortbar">
          <em>Sort</em>
          <button class="sortbtn" data-sort="az" aria-pressed="false">A–Z</button>
          <button class="sortbtn" data-sort="pts" aria-pressed="false">Points</button>
        </div>
        <div class="list" data-list="states"></div>
      </div>
    </div>
    `
  + Object.entries(OPTIONAL).map(([gid,g])=>`
    <div class="grp">
      <div class="grouphead" role="button" tabindex="0" data-g="${gid}" aria-expanded="false">
        <span class="chev">▶</span>
        <span class="gtext"><h2>${g.name}</h2><p data-count="${gid}"></p></span>
      </div>
      <div class="body" data-body="${gid}"></div>
    </div>`).join('')
  + `<div class="grp">
      <div class="grouphead" role="button" tabindex="0" data-g="spotted" aria-expanded="false">
        <span class="chev">▶</span>
        <span class="gtext"><h2>Spotted</h2><p data-count="spotted"></p></span>
      </div>
      <div class="body" data-body="spotted"></div>
    </div>`;

/* Its own block, after the plate groups. Deliberately keeps .grouphead /
   data-g / .body / data-body so the `opened` set, the body-level click
   handler and the aria-expanded sync all work on it unchanged — only the
   position and the styling are new. */
document.getElementById('achv').innerHTML =
  `<div class="grouphead" role="button" tabindex="0" data-g="ach" aria-expanded="false">
      <span class="chev">▶</span>
      <span class="gtext">
        <h2>🏆 Achievements</h2>
        <p data-count="ach"></p>
        <span class="achstrip" data-strip="ach"></span>
      </span>
    </div>
    <div class="body" data-body="ach"></div>`;

/* Progress is states only — see the note by .prog in the stylesheet */
function renderProgress(){
  const codes=Object.keys(STATES);
  const got=codes.filter(c=>claimed.has(c)).length;
  const pct=Math.round(got/codes.length*100);
  document.getElementById('progfill').style.width=pct+'%';
  document.getElementById('proglabl').textContent=`${got} of ${codes.length} states`;
  document.getElementById('proglabr').textContent=pct+'%';
}
function achProgress(a){
  if(a.set) return {got:a.set.filter(c=>claimed.has(c)).length, need:a.set.length};
  if(a.any){ const n=Object.keys(STATES).filter(c=>claimed.has(c)).length;
    return {got:Math.min(n,a.any), need:a.any}; }
  if(a.tier){ const s=Object.keys(STATES).filter(c=>STATES[c][1]===a.tier);
    return {got:s.filter(c=>claimed.has(c)).length, need:s.length}; }
  const s=Object.keys(STATES);
  return {got:s.filter(c=>claimed.has(c)).length, need:s.length};
}
const achEarned=()=>ACH.filter(a=>{const p=achProgress(a);return p.got>=p.need;});

/* Seeded from the saved board so nothing fires on load — an unlock banner is
   for the moment it happens, not for every app start. */
let earnedIds=new Set(achEarned().map(a=>a.id));
function unlockBanner(a){
  const el=document.createElement('div');
  el.className='unlock';
  el.innerHTML=`<span class="ubadge">${a.e}</span>
    <span class="utext"><b>Achievement unlocked</b><span>${a.n}</span></span>
    <span class="upt">+${a.p}</span>`;
  document.body.appendChild(el);
  /* Long enough to actually read the name in a moving car. If this changes,
     the queue spacing in unlockCheck() must stay larger than this + 340ms. */
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),340); },4200);
}
/* Diff against what was earned before this tap. Delayed past the plate callout
   so the two never land on screen as one event; several at once queue up. */
function unlockCheck(){
  const now=achEarned();
  const fresh=now.filter(a=>!earnedIds.has(a.id));
  earnedIds=new Set(now.map(a=>a.id));
  fresh.forEach((a,i)=>setTimeout(()=>unlockBanner(a),900+i*4700));
}

function totals(){
  let n=0,score=0;
  for(const c of claimed.keys()) if(live(c)){ n++; score+=INDEX[c].pts; }
  const bonus=achEarned().reduce((a,x)=>a+x.p,0);
  return {total:BOARD_SIZE,n,score:score+bonus,bonus};
}
function renderStats(bump){
  const {total,n,score}=totals();
  const f=document.getElementById('found'), p=document.getElementById('pts');
  f.textContent=n; p.textContent=score;
  document.getElementById('total').textContent=total;
  if(bump) for(const el of [f,p]){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
}
function renderLists(){
  /* states */
  const hunt=sortStates(Object.keys(STATES).filter(c=>!claimed.has(c)));
  const left=hunt.reduce((a,c)=>a+INDEX[c].pts,0);
  document.querySelector('[data-list="states"]').innerHTML = hunt.length
    ? hunt.map(c=>rowHTML(c,false)).join('')
    : `<div class="done">Every state. That's the whole country.</div>`;
  document.querySelector('[data-count="states"]').textContent =
    hunt.length?`${hunt.length} left · ${left} pts still out there`:'Complete';
  document.querySelectorAll('.sortbtn').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.sort===sortMode));

  /* achievements — locked rows read as dimmed silhouettes with a progress bar,
     earned rows light up. Always visible: a hidden achievement does nothing
     for the player who's behind. */
  const earnedList=achEarned();
  const bonus=earnedList.reduce((a,x)=>a+x.p,0);
  const earnedSet=new Set(earnedList.map(a=>a.id));
  document.querySelector('[data-count="ach"]').textContent =
    `${earnedList.length} of ${ACH.length} unlocked · +${bonus} pts`;
  /* the teaser: every badge on the banner, locked ones dimmed the same way
     the rows below are, so the section is worth opening at a glance */
  document.querySelector('[data-strip="ach"]').innerHTML =
    ACH.map(a=>`<i class="${earnedSet.has(a.id)?'got':''}">${a.e}</i>`).join('');
  document.querySelector('[data-body="ach"]').innerHTML =
    `<div class="achhead"><b>${earnedList.length}</b><span>of ${ACH.length} unlocked</span>
       <em>+${bonus} pts</em></div>`
    + ACH.map(a=>{
      const {got,need}=achProgress(a), done=got>=need;
      const close=!done&&need-got<=2;
      return `<div class="ach${done?' got':close?' close':''}">
        <span class="abadge">${a.e}</span>
        <span class="atext">${a.n}<em>${a.d}${done?'':` · ${got}/${need}`}</em>${
          done?'':`<span class="abar"><i style="width:${Math.round(got/need*100)}%"></i></span>`}</span>
        <span class="apt">${done?'✓':'+'+a.p}</span></div>`;
    }).join('');

  /* optional groups — always in play, no switch */
  for(const [gid,g] of Object.entries(OPTIONAL)){
    const rest=g.items.filter(i=>!claimed.has(i[0]));
    const got=g.items.length-rest.length;
    const avail=g.items.reduce((a,i)=>a+i[2],0);
    document.querySelector(`[data-count="${gid}"]`).textContent =
      `${got} / ${g.items.length} · ${avail} bonus pts`;
    document.querySelector(`[data-body="${gid}"]`).innerHTML =
      rest.length ? rest.map(i=>rowHTML(i[0],false)).join('')
      : `<div class="empty">All of them. Nice.</div>`;
  }

  /* spotted */
  const got=[...claimed.keys()].filter(live);
  got.sort((a,b)=>(claimed.get(b)||0)-(claimed.get(a)||0)||INDEX[b].pts-INDEX[a].pts);
  const score=got.reduce((a,c)=>a+INDEX[c].pts,0);
  document.querySelector('[data-count="spotted"]').textContent =
    got.length?`${got.length} plates · ${score} pts`:'Nothing yet';
  document.querySelector('[data-body="spotted"]').innerHTML =
    got.length?got.map(c=>rowHTML(c,true)).join('')
    :`<div class="empty">Your finds will collect here.</div>`;
  document.querySelectorAll('[data-body="spotted"] .row').forEach(r=>r.classList.add('on'));

  document.querySelectorAll('.body').forEach(b=>b.classList.toggle('show',opened.has(b.dataset.body)));
  document.querySelectorAll('.grouphead').forEach(h=>h.setAttribute('aria-expanded',opened.has(h.dataset.g)));
  if(deckReady) syncDeck();
}
function render(bump){ renderProgress(); renderStats(bump); renderLists(); save(); }

/* ── the callout, scaled to rarity ── */
const SHOUT={
  common:  {text:false, flare:false, burn:false, dur:0},
  uncommon:{text:true,  flare:false, burn:false, dur:1250},
  rare:    {text:true,  flare:true,  burn:false, dur:1750},
  legend:  {text:true,  flare:true,  burn:true,  dur:2250}
};
const celebrate=document.getElementById('celebrate');
function shout(code){
  const i=INDEX[code], cfg=SHOUT[i.tier];
  if(!cfg.text) return;
  celebrate.innerHTML='';
  // centre of the viewport below the deck — no map to anchor to any more
  const deckB=(deckEl||document.getElementById('deck')).getBoundingClientRect().bottom;
  celebrate.style.top=Math.max(deckB+(window.innerHeight-deckB)*0.32,120)+'px';
  const name=i.name.toUpperCase();
  const size=Math.min(46,Math.max(19,470/Math.max(name.length,6)));
  const el=document.createElement('div');
  el.className='shout'+(cfg.burn?' legend':'');
  el.style.setProperty('--fc',TIER[i.tier].color);
  el.style.setProperty('--dur',cfg.dur+'ms');
  el.innerHTML=(cfg.flare?`<div class="fl"></div>`:'')+
    `<div class="nm" style="font-size:${size.toFixed(1)}px">${name}</div>
     <div class="pt">+${i.pts} · ${TIER[i.tier].label}</div>`;
  celebrate.appendChild(el);
  setTimeout(()=>{ if(el.parentNode===celebrate) celebrate.innerHTML=''; },cfg.dur+80);
}
/* Legendary blackout — the whole screen, where the map dim used to be */
function burn(){
  const el=document.createElement('div');
  el.className='blackout';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1500);
}

/* ── undo: mis-taps happen in a moving car ── */
let undoTimer=null;
function hideUndo(){
  const el=document.getElementById('undoBtn');
  if(!el) return;
  el.classList.add('out');
  setTimeout(()=>el.remove(),260);
}
function showUndo(code){
  clearTimeout(undoTimer);
  const old=document.getElementById('undoBtn'); if(old) old.remove();
  const el=document.createElement('button');
  el.className='undo'; el.id='undoBtn'; el.type='button';
  el.textContent='Undo '+code;

/* ══ group play ═══════════════════════════════════════════════════════
   The local board stays authoritative. Spots go into an outbox and flush
   when there's a signal — you are guaranteed to be in a dead zone exactly
   where the 10-pointers live. The scoreboard falls back to cached totals,
   never to an error.

   Supabase is optional here: every call is plain fetch, and the CDN client
   is used only for the live push. If it fails to load, polling covers it
   and solo play is untouched.
   ═════════════════════════════════════════════════════════════════════ */
const SB_URL='https://bejgcgrbdrnuvwvcqrvz.supabase.co';
const SB_KEY='sb_publishable_t64k5eE5QNvOKH-348LLvA_b7ogAGTA';

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function rpc(fn,body){
  const r=await fetch(SB_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  const t=await r.text();
  let j=null; try{ j=t?JSON.parse(t):null; }catch(e){}
  if(!r.ok){
    /* the server understood and refused — distinct from "no signal", which throws above */
    const err=new Error((j&&(j.message||j.details))||('HTTP '+r.status));
    err.refused=true; throw err;
  }
  return j;
}
const saveGame=()=>{
  store.set('lpb.game',game?JSON.stringify(game):'');
  store.set('lpb.entry',me?JSON.stringify(me):'');

const saveOutbox=()=>{
  store.set('lpb.outbox',JSON.stringify(outbox));
  store.set('lpb.synced',JSON.stringify([...synced]));

/* one pending op per plate — whatever you did last wins */
function queue(op,code,pts){
  if(!me) return;
  outbox=outbox.filter(o=>o.code!==code);
  outbox.push({op,code,pts:pts||0,ts:Date.now(),tries:0});
  saveOutbox(); flush();
}

/* Self-healing: anything the server hasn't confirmed gets queued again.
   add_spot is idempotent, so re-sending is free. This is what rescues spots
   made during the lobby, or refused during a blip, without any bookkeeping. */
function reconcile(){
  if(!me) return;
  const pending=new Set(outbox.map(o=>o.code));
  for(const code of claimed.keys())
    if(live(code)&&!synced.has(code)&&!pending.has(code)) queue('add',code,INDEX[code].pts);
  for(const code of synced)
    if(!claimed.has(code)&&!pending.has(code)) queue('del',code);
}

let flushing=false;
async function flush(){
  if(flushing||!me||!outbox.length||navigator.onLine===false) return;
  flushing=true;
  try{
    while(outbox.length){
      const o=outbox[0];
      try{
        if(o.op==='add'){
          await rpc('add_spot',{p_entry:me.id,p_secret:me.secret,
            p_code:o.code,p_pts:o.pts,p_spotted_at:new Date(o.ts).toISOString()});
          synced.add(o.code);
        }else{
          await rpc('remove_spot',{p_entry:me.id,p_secret:me.secret,p_code:o.code});
          synced.delete(o.code);
        }
        outbox.shift();
      }catch(err){
        if(err&&err.refused){
          /* refused for a reason we can't fix by waiting on this item —
             drop it so it can't block the queue; reconcile() re-queues it
             later if it still matters (e.g. the game hadn't started yet) */
          outbox.shift();
        }else{
          o.tries=(o.tries||0)+1;          /* no signal: keep it and retry */
          if(o.tries>=8) outbox.shift(); else throw err;
        }
      }
      saveOutbox();
    }
    await syncBonus();
    await refreshBoard();
  }catch(e){ /* whatever is left stays queued for the next try */ }
  finally{ flushing=false; renderGame(); }
}

/* ── collapse the deck on scroll ──
   Collapsing shortens the page. If the page is barely scrollable (all sections
   closed), that shortening snaps you back to the top, which re-expands, which
   lengthens the page again — an infinite flicker. So we only collapse when
   there will still be room to stay scrolled afterwards. ── */
var deckEl=null, deckShrink=0, deckReady=false, deckLocked=false, deckDirty=false;
/* Measuring is violent: it adds `nomotion`, which is `*{animation:none}`, so it
   kills every running animation on the page — the row sliding out, the score
   bump, the callout — and it rips `.scrolled` off and back on. Never do that
   mid-tap. iOS fires `resize` when the URL bar shows or hides, which is exactly
   when a row animating out changes the content height, so this WILL be called
   at the worst moment unless it defers. */
function measureDeck(){
  if(deckLocked){ deckDirty=true; return; }
  deckEl=deckEl||document.getElementById('deck');
  if(!deckEl) return;
  deckDirty=false;
  const wasCompact=document.body.classList.contains('scrolled');
  deckEl.classList.add('nomotion');
  document.body.classList.remove('scrolled');
  const hExpanded=deckEl.offsetHeight;
  document.body.classList.add('scrolled');
  const hCompact=deckEl.offsetHeight;
  document.body.classList.toggle('scrolled',wasCompact);
  void deckEl.offsetHeight;
  deckEl.classList.remove('nomotion');
  deckShrink=Math.max(0,hExpanded-hCompact);
  deckReady=true;
}
/* Hold the deck still for a beat. Used while a field has focus (iOS scrolls the
   page to reveal the keyboard) and while a spotted row is animating out. */
var deckHold=null;
function holdDeck(ms){
  deckLocked=true;
  clearTimeout(deckHold);
  deckHold=setTimeout(()=>{
    deckLocked=false;
    if(deckDirty) measureDeck();   // whatever we deferred, catch up now
    syncDeck();
  },ms);
}
function syncDeck(){
  if(deckLocked) return;
  const y=window.scrollY||window.pageYOffset||0;
  const isCompact=document.body.classList.contains('scrolled');
  // page height as it would be with the deck fully expanded
  const fullHeight=document.documentElement.scrollHeight+(isCompact?deckShrink:0);
  const room=fullHeight-deckShrink-window.innerHeight;
  /* Hysteresis, and it is not optional. A single threshold makes the deck flip
     back and forth whenever the page height lands on it — which a row animating
     out does, every frame, for 320ms. That reads as the screen shaking. It takes
     real room to collapse; it takes running out of room to expand again. */
  if(!isCompact && y>52 && room>96) document.body.classList.add('scrolled');
  else if(isCompact && (y<16 || room<24)) document.body.classList.remove('scrolled');
}
(function(){
  let ticking=false;
  window.addEventListener('scroll',()=>{
    if(!ticking){ ticking=true; requestAnimationFrame(()=>{ syncDeck(); ticking=false; }); }
  },{passive:true});
  /* iOS fires resize constantly as the URL bar slides — height changes, width
     does not. The deck's shrink only depends on width (it decides how the text
     wraps), so a height-only resize must never trigger a re-measure. This is
     what was calling measureDeck() in the middle of a tap. */
  let rz=null, lastW=window.innerWidth;
  window.addEventListener('resize',()=>{
    clearTimeout(rz);
    rz=setTimeout(()=>{
      if(window.innerWidth!==lastW){ lastW=window.innerWidth; measureDeck(); }
      syncDeck();
    },160);
  });
  window.addEventListener('load',()=>{ measureDeck(); syncDeck(); });
  const isField=t=>t&&t.tagName&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA');
  document.addEventListener('focusin',e=>{
    if(!isField(e.target)) return;
    clearTimeout(deckHold);
    deckLocked=true;
    document.body.classList.add('scrolled');   // compact, and pinned that way
  });
  document.addEventListener('focusout',e=>{
    if(!isField(e.target)) return;
    holdDeck(140);                             // settle after iOS finishes its scroll
  });
  measureDeck(); syncDeck();
})();

/* ── service worker: register, and auto-reload once when a new one takes over ── */
if('serviceWorker' in navigator){
  let refreshing=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}

render(false);
</script>
</body>
</html>
